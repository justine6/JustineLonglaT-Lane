name: Nightly Hygiene

on:
  schedule:
    - cron: "20 3 * * *" # daily 03:20 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (deterministic)
        run: pnpm install --frozen-lockfile

      - name: Audit (full)
        run: pnpm audit

      - name: Outdated report
        run: pnpm run deps:check

      - name: Build (regression detection)
        run: pnpm run build